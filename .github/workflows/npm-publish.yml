name: Publish to npm

# Triggered by prevsh/platform after it uploads the npm tarball asset to
# this public release repo. Manual dispatch remains available for reruns.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. cli-v1.12.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download npm tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.tgz" \
            --dir ./
          ls -la *.tgz

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        run: |
          TARBALL=$(ls *.tgz | head -1)
          npm publish "$TARBALL" --access public --provenance
