name: Publish to npm

# Triggered on prevsh/apt release events (published OR released — the
# latter fires when a release is promoted to "latest", which the Forgejo
# release-cli workflow does after asset upload). Also exposes
# workflow_dispatch for manual reruns without a release event.

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.11.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download npm tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.tgz" \
            --dir ./
          ls -la *.tgz

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        run: |
          TARBALL=$(ls *.tgz | head -1)
          npm publish "$TARBALL" --access public --provenance
